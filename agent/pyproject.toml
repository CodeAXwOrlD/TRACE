[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-agent"
version = "0.1.0"
description = "TRACE AI-Assisted Financial Fraud Investigation and Case Intelligence Layer"
authors = [{ name = "TRACE AI Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
